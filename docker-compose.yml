# Local development environment. Runs without any real secret:
# Turnstile uses Cloudflare's public test keys, email goes to Mailpit and R2/KV are
# emulated by Wrangler. See docs/local-environment.md and docs/security.md.

x-node: &node
  build:
    context: .
    dockerfile: Dockerfile.dev
  volumes:
    - .:/app
    - node_modules:/app/node_modules
  environment: &node-env
    NODE_ENV: development

services:
  deps:
    <<: *node
    # Reinstalls only when package-lock.json changes, so restarting a service never
    # wipes node_modules under a running container.
    command:
      - sh
      - -c
      - >-
        hash=$$(sha256sum package-lock.json | cut -d' ' -f1);
        [ "$$(cat node_modules/.lock-hash 2>/dev/null)" = "$$hash" ] ||
        (npm ci --no-audit && echo "$$hash" > node_modules/.lock-hash)
    restart: 'no'

  api:
    <<: *node
    command: npm run dev:local -w apps/api
    depends_on:
      deps:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    ports:
      - '8787:8787'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - wrangler_state:/app/apps/api/.wrangler
    environment:
      <<: *node-env
      ALLOWED_ORIGIN: http://localhost:4321
      EMAIL_TRANSPORT: mailpit
      MAILPIT_URL: http://mailpit:8025
      # Public test secret from Cloudflare docs: always passes. Not a credential.
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      DOWNLOAD_TOKEN_SECRET: local-dev-only-0000000000000000000000000000
      NOTIFY_EMAIL: owner@example.test

  web:
    <<: *node
    command: npm run dev -w apps/web -- --host 0.0.0.0 --port 4321
    depends_on:
      deps:
        condition: service_completed_successfully
    ports:
      - '4321:4321'
    environment:
      <<: *node-env
      PUBLIC_API_URL: http://localhost:8787
      # Public test site key from Cloudflare docs: always passes.
      PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - '8025:8025'

volumes:
  node_modules:
  wrangler_state:
